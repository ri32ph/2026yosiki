<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>別紙様式1-1：入力画面</title>
    <style>
        body {
            background-color: #525659; /* PDFビューア風の背景色 */
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .page {
            width: 210mm;
            height: 297mm; /* A4正寸 */
            background-color: white;
            position: relative;
            
            /* 【修正ポイント】パスの書き方 */
            /* 画像形式がpngなら .png に書き換えてください */
            background-image: url('./Reference/page1.jpg'); 
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        /* 入力欄が見えやすいように一時的に背景色を付けています */
        .field {
            position: absolute;
            border: 1px solid rgba(255, 0, 0, 0.3); /* 位置調整用の赤い枠 */
            background: rgba(255, 255, 255, 0.4);
            box-sizing: border-box;
            font-size: 14px;
        }

        /* 座標（微調整用） */
        .medical-inst { top: 7.2%; left: 10%; width: 40%; height: 20px; }
        .patient-name  { top: 23.5%; left: 20%; width: 35%; height: 30px; font-size: 18px; }
        /* ...他の項目も同様... */

    </style>
</head>
<body>

    <div class="page">
        <div style="position:absolute; color:red; top:50%; left:35%; z-index:-1;">
            画像が読み込めていない場合は<br>
            Reference/page1.jpg があるか確認してください
        </div>

        <input type="text" class="field medical-inst" placeholder="医療機関名">
        <input type="text" class="field patient-name" placeholder="患者氏名">
    </div>

</body>
</html>
