<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>別紙様式1-1：患者の服薬状況等に係る情報提供書</title>
    <style>
        /* A4サイズ設定 */
        body {
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .page {
            width: 210mm;
            height: 296mm;
            background-color: white;
            position: relative;
            /* Referenceフォルダ内の画像を参照 [cite: 1] */
            background-image: url('Reference/page1.jpg'); 
            background-size: 100% 100%;
            background-repeat: no-repeat;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }

        /* 入力フィールドの基本設定 */
        .field {
            position: absolute;
            border: 1px dashed rgba(0, 123, 255, 0.3); /* 位置調整用の枠線 */
            background: rgba(255, 255, 255, 0.5);
            box-sizing: border-box;
            font-size: 13px;
            padding: 2px;
            color: #333;
        }

        .field:focus {
            background: white;
            border: 1px solid #007bff;
            outline: none;
        }

        /* --- 座標指定（PDFの[source]番号に基づいた概算） --- */
        
        /* 医療機関・担当医・科 */
        .medical-inst { top: 7.2%; left: 10%; width: 40%; }
        .doctor-name  { top: 9.3%; left: 10%; width: 22%; }
        .dept-name    { top: 9.3%; left: 33%; width: 10%; }

        /* 薬局情報 */
        .date-year    { top: 6.8%; left: 78%; width: 15%; } /* 令和... [cite: 7] */
        .pharmacy-loc { top: 11.5%; left: 55%; width: 40%; height: 5%; } /* 所在地・名称 [cite: 7] */
        .tel-fax      { top: 16.5%; left: 63%; width: 32%; } /* [cite: 8, 9, 10] */
        .pharmacist   { top: 19.2%; left: 63%; width: 25%; } /* [cite: 11] */

        /* 患者情報 */
        .patient-name { top: 23.5%; left: 20%; width: 35%; font-size: 18px; } /* [cite: 14] */
        .patient-sex  { top: 23.5%; left: 57%; width: 5%; } /* [cite: 15] */
        .patient-birth{ top: 23.5%; left: 70%; width: 20%; } /* [cite: 12, 13] */
        .patient-addr { top: 27.2%; left: 20%; width: 60%; } /* [cite: 16] */
        .patient-tel  { top: 29.8%; left: 20%; width: 30%; } /* [cite: 17] */

        /* 情報提供の概要・日付 */
        .summary-date { top: 34.2%; left: 15%; width: 20%; }

        /* 1 処方薬の情報 */
        .info-1 { top: 39.5%; left: 12%; width: 80%; height: 4%; }
        /* 2 併用薬剤等 */
        .info-2 { top: 46.5%; left: 12%; width: 80%; height: 6%; }
        /* 3 処方薬剤の服用状況 */
        .info-3 { top: 55.2%; left: 12%; width: 80%; height: 4.5%; }
        /* 4 患者、家族又は介護者からの情報 */
        .info-4 { top: 62.5%; left: 12%; width: 80%; height: 4.5%; }
        /* 5 薬剤に関する提案 */
        .info-5 { top: 69.8%; left: 12%; width: 80%; height: 4.5%; }
        /* 6 その他 */
        .info-6 { top: 76.8%; left: 12%; width: 80%; height: 4%; }

        /* 印刷時の設定 */
        @media print {
            body { background: none; }
            .page { margin: 0; box-shadow: none; -webkit-print-color-adjust: exact; }
            .field { border: none; background: transparent; }
        }
    </style>
</head>
<body>

<div class="page">
    <input type="text" class="field medical-inst" placeholder="保険医療機関名">
    <input type="text" class="field doctor-name" placeholder="担当医">
    <input type="text" class="field dept-name" placeholder="科">
    <input type="text" class="field date-year" value="令和  年  月  日">

    <textarea class="field pharmacy-loc" placeholder="薬局の所在地及び名称"></textarea>
    <input type="text" class="field tel-fax" placeholder="TEL: / FAX:">
    <input type="text" class="field pharmacist" placeholder="保険薬剤師氏名">

    <input type="text" class="field patient-name" placeholder="氏名">
    <input type="text" class="field patient-sex" placeholder="男">
    <input type="text" class="field patient-birth" placeholder="年 月 日生">
    <input type="text" class="field patient-addr" placeholder="住所">
    <input type="text" class="field patient-tel" placeholder="電話番号">

    <input type="text" class="field summary-date" placeholder="年 月 日">
    <textarea class="field info-1" placeholder="薬剤名等"></textarea>
    <textarea class="field info-2" placeholder="薬剤名等"></textarea>
    <textarea class="field info-3"></textarea>
    <textarea class="field info-4"></textarea>
    <textarea class="field info-5"></textarea>
    <textarea class="field info-6"></textarea>
</div>

</body>
</html>
